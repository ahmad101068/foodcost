name: Android financial recovery instrumented tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ir.foodcost.app.data.SqliteOperationStoreTest --no-daemon --stacktrace
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ir.foodcost.app.UnreadableWarningTest --no-daemon --stacktrace
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ir.foodcost.app.WalkThroughTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foodcost-instrumentation-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
