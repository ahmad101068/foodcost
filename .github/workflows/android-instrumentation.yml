name: Android financial recovery instrumented tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "presentation/**"
      - "scripts/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and check the complete regression suite
        run: |
          python3 scripts/check_android_test_suite.py
          ./gradlew :core:test :data:test :presentation:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            ./scripts/pixel083/run_device_checks.sh "$(command -v adb)" native-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foodcost-instrumentation-results
          path: |
            native-results/
            **/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
