name: tests

# Runs the tests of every module when code or the build changes.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "data/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "core/**"
      - "data/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --no-daemon 2>&1 | tee build.log
      # Puts the compiler errors and failed tests on the run page as one annotation,
      # readable through the API without downloading the logs.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          lines=$(grep -E "^e: |FAILED|What went wrong|Caused by|expected:|Exception" build.log | head -60 || true)
          message=$(printf '%s' "$lines" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build or tests failed::${message}"
