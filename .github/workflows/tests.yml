name: tests

# Runs the tests of every module when code or the build changes.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "data/**"
      - "presentation/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "core/**"
      - "data/**"
      - "presentation/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test
        shell: bash
        # Leaves the Android app out: these modules build without the Android SDK.
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: |
          set -o pipefail
          ./gradlew :core:test :data:test :presentation:test --no-daemon 2>&1 | tee build.log
      # The annotations below can be read through the API without downloading the logs.
      # This one shows how many tests each module ran, so a module that runs none stands out.
      - name: Count tests
        shell: bash
        run: |
          counts=""
          for module in core data presentation; do
            n=$(cat "$module"/build/test-results/test/*.xml 2>/dev/null | grep -c "<testcase " || true)
            counts="$counts $module: ${n:-0},"
          done
          echo "::notice title=Tests passed::${counts%,}"
      # This one lists the compiler errors and failed tests.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          lines=$(grep -E "^e: |FAILED|What went wrong|Caused by|expected:|Exception" build.log | head -60 || true)
          message=$(printf '%s' "$lines" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build or tests failed::${message}"
