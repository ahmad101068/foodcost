name: Independent pricing audit 2026-11-13
on:
  push:
    branches: ["audit/pricing-2026-11-13"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Add independent audit tests in the disposable runner
        run: |
          cp audit/2026-11-13/CorePricingAudit20261113Test.kt core/src/test/kotlin/ir/foodcost/core/
          cp audit/2026-11-13/PresentationPricingAudit20261113Test.kt presentation/src/test/kotlin/ir/foodcost/presentation/
      - name: Run the complete JVM suite plus independent audit cases
        shell: bash
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: |
          set -o pipefail
          ./gradlew :core:test :data:test :presentation:test --continue --no-daemon --stacktrace 2>&1 | tee pricing-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-pricing-audit-results
          path: |
            pricing-audit.log
            core/build/test-results/test/
            core/build/reports/tests/test/
            data/build/test-results/test/
            presentation/build/test-results/test/
            presentation/build/reports/tests/test/
          retention-days: 30
