name: R07501 pull request verification

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "presentation/**"
      - ".github/workflows/r07501-pr-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify JVM tests and compile Android sources and instrumented tests
        run: ./gradlew :presentation:test :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace
