name: Export exact FoodCost 0.8.3 source
on:
  push:
    branches:
      - audit/export-source-083-2026-11-17
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive from immutable 0.8.3 commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=6c2bf74b713f4febfda53019324af053298d56ef
          test "$(git show "$BASE:app/build.gradle.kts" | sed -n 's/.*val appVersion = "\([^"]*\)".*/\1/p' | head -1)" = "0.8.3"
          git archive --format=zip --output="$RUNNER_TEMP/FoodCost-0.8.3-source-6c2bf74.zip" "$BASE"
          unzip -t "$RUNNER_TEMP/FoodCost-0.8.3-source-6c2bf74.zip" | tail -1
          sha256sum "$RUNNER_TEMP/FoodCost-0.8.3-source-6c2bf74.zip" | tee "$RUNNER_TEMP/source.sha256"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: FoodCost-0.8.3-source-6c2bf74
          path: |
            ${{ runner.temp }}/FoodCost-0.8.3-source-6c2bf74.zip
            ${{ runner.temp }}/source.sha256
          retention-days: 14
