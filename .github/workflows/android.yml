name: android

# Builds the APK for every change to the app or the modules it uses. A manual run (or a push
# to main) also publishes it as the "preview" pre-release, with a stable download link.
on:
  push:
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "presentation/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/android.yml"
      - ".github/preview-notes.md"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as the preview release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # Without a private key the APK is signed with the debug key. Keeping that key between
      # builds lets each new APK install over the last one on the phone.
      - name: Keep the debug key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      - name: Use the private key, if the repository has one
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FOODCOST_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/foodcost.keystore"
            echo "FOODCOST_KEYSTORE_FILE=$RUNNER_TEMP/foodcost.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build
        shell: bash
        env:
          FOODCOST_KEYSTORE_PASSWORD: ${{ secrets.FOODCOST_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :presentation:test :app:assembleRelease --no-daemon 2>&1 | tee build.log
      # Annotations can be read through the API without downloading the logs.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          lines=$(grep -E "^e: |error:|ERROR|FAILED|What went wrong|Caused by|Could not|expected:|Exception|> " build.log | head -90 || true)
          message=$(printf '%s' "$lines" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Android build failed::${message}"
      - name: Describe the APK
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          echo "::notice title=APK built::$(du -k "$apk" | cut -f1) KB, version code $((GITHUB_RUN_NUMBER + 1))"
      - name: Publish the preview
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk foodcost-preview.apk
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview foodcost-preview.apk --prerelease --target "$GITHUB_SHA" \
            --title "نسخهٔ آزمایشی فودکاست" --notes-file .github/preview-notes.md
