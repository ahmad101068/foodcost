name: android

# Builds the APK for every change to the app or the modules it uses and keeps it in a draft
# release, which only the repository's owners can see. Nothing here publishes anything publicly.
on:
  push:
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "presentation/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/android.yml"
      - ".github/preview-notes.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # Without a private key the APK is signed with the debug key. Keeping that key between
      # builds lets each new APK install over the last one on the phone.
      - name: Keep the debug key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      - name: Use the private key, if the repository has one
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FOODCOST_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/foodcost.keystore"
            echo "FOODCOST_KEYSTORE_FILE=$RUNNER_TEMP/foodcost.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build
        shell: bash
        env:
          FOODCOST_KEYSTORE_PASSWORD: ${{ secrets.FOODCOST_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :presentation:test :app:assembleRelease --no-daemon 2>&1 | tee build.log
      # Annotations can be read through the API without downloading the logs.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          lines=$(grep -E "^e: |error:|ERROR|FAILED|What went wrong|Caused by|Could not|expected:|Exception|> " build.log | head -90 || true)
          message=$(printf '%s' "$lines" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Android build failed::${message}"
      - name: Describe the APK
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          echo "::notice title=APK built::$(du -k "$apk" | cut -f1) KB, version code $((GITHUB_RUN_NUMBER + 1))"
      - name: Keep the APK in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk foodcost.apk
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft and .name == "APK for testing") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create apk-for-testing foodcost.apk --draft --target "$GITHUB_SHA" \
            --title "APK for testing" --notes-file .github/preview-notes.md

  # Walks through the app on an Android emulator and keeps a screenshot of each step,
  # published as a draft release (visible only to the repository's owners).
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the app, its test and the release build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/walkthrough.sh
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          lines=$( { grep -E "^e: |error:|What went wrong|FAILED" build.log; grep -E "FAILURES|Exception|Error|expected|Caused by|at ir\.foodcost|Tests run" walkthrough.log; grep -E "FATAL|AndroidRuntime|ir\.foodcost" logcat.txt; } 2>/dev/null | head -90 || true)
          message=$(printf '%s' "$lines" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Walk-through failed::${message}"
      - name: Publish the screenshots
        if: always() && hashFiles('screenshots/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft and .name == "Walk-through screenshots") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create walkthrough screenshots/*.png --draft --target "$GITHUB_SHA" \
            --title "Walk-through screenshots" --notes "Screenshots of the automated walk-through at ${GITHUB_SHA::7}."
