name: android

# Builds the APK for every change to the app or the modules it uses and keeps it in a draft
# release, which only the repository's owners can see. Nothing here publishes anything publicly.
on:
  push:
    paths:
      - "app/**"
      - "scripts/walkthrough.sh"
      - "core/**"
      - "data/**"
      - "presentation/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/android.yml"
      - ".github/preview-notes.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # The APK for testing is signed with the app's own key or not made at all: one signed with
      # another key does not install over it, and going back means deleting the app and its data.
      - name: Use the private key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FOODCOST_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOODCOST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing::The repository has no private key (FOODCOST_KEYSTORE_B64 and FOODCOST_KEYSTORE_PASSWORD), so no APK is made"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/foodcost.keystore"
          echo "FOODCOST_KEYSTORE_FILE=$RUNNER_TEMP/foodcost.keystore" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        env:
          FOODCOST_KEYSTORE_PASSWORD: ${{ secrets.FOODCOST_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :presentation:test :app:assembleRelease :app:bundleRelease --no-daemon 2>&1 | tee build.log
      # The certificate's fingerprint is public, the same in every APK: a different one means the
      # APK was signed with another key and is not kept.
      - name: Check the APK's signature
        shell: bash
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if ! grep -qi "SHA-256 digest: 72c370e72612b453844e3a8c5d02d5ebc89c918f1ab68a56e22e4623309a8b22" signature.txt; then
            echo "::error title=Signing::The APK is not signed with the app's own key"
            exit 1
          fi
      - name: Keep Play Store AAB as private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodcost-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      # Annotations can be read through the API without downloading the logs.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          lines=$(grep -E "^e: |error:|ERROR|FAILED|What went wrong|Caused by|Could not|expected:|Exception|> " build.log | head -90 || true)
          message=$(printf '%s' "$lines" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Android build failed::${message}"
      - name: Describe the APK
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          echo "::notice title=APK built::$(du -k "$apk" | cut -f1) KB, version $(grep -m1 'val appVersion = ' app/build.gradle.kts | cut -d'"' -f2), build $GITHUB_RUN_NUMBER"
      - name: Keep the APK in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # One draft per branch, so a feature branch never replaces the APK built from main.
        run: |
          cp app/build/outputs/apk/release/app-release.apk foodcost.apk
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            name="APK for testing"; tag="apk-for-testing"
          else
            name="APK for testing ($GITHUB_REF_NAME)"; tag="apk-for-testing-${GITHUB_REF_NAME//\//-}"
          fi
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .name == \"$name\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$tag" foodcost.apk --draft --target "$GITHUB_SHA" \
            --title "$name" --notes-file .github/preview-notes.md

  # Walks through the app on an Android emulator and keeps a screenshot of each step,
  # published as a draft release (visible only to the repository's owners).
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # The release build is only started on the emulator here, which any key does for, and
      # Gradle makes no release APK without one. So it is signed with a throwaway key made for this
      # run alone: the app's own key stays in the apk job, the only one that needs it.
      - name: Make a throwaway key for the release build's start
        shell: bash
        run: |
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.p12" -storetype PKCS12 -alias foodcost \
            -keyalg RSA -keysize 2048 -validity 2 -storepass "$pass" -keypass "$pass" -dname "CN=throwaway" > /dev/null
          echo "FOODCOST_KEYSTORE_FILE=$RUNNER_TEMP/throwaway.p12" >> "$GITHUB_ENV"
          echo "FOODCOST_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
      - name: Build the app, its test and the release build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # A private repository's runner has 2 processors, a public one's 4.
          cores: ${{ github.event.repository.private && 2 || 4 }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/walkthrough.sh
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          lines=$( { grep -E "^e: |error:|What went wrong|FAILED" build.log; grep -E "FAILURES|Exception|Error|expected|Caused by|at ir\.foodcost|Tests run" walkthrough.log unreadable.log recovery.log; grep -E "FATAL|AndroidRuntime|ir\.foodcost" logcat.txt; } 2>/dev/null | head -90 || true)
          message=$(printf '%s' "$lines" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Walk-through failed::${message}"
      - name: Publish the screenshots
        if: always() && hashFiles('screenshots/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            name="Walk-through screenshots"; tag="walkthrough"
          else
            name="Walk-through screenshots ($GITHUB_REF_NAME)"; tag="walkthrough-${GITHUB_REF_NAME//\//-}"
          fi
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .name == \"$name\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$tag" screenshots/*.png --draft --target "$GITHUB_SHA" \
            --title "$name" --notes "Screenshots of the automated walk-through at ${GITHUB_SHA::7}."
