name: Source snapshot for independent audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact checked-out source
        run: |
          zip -q -r foodcost-source-audit.zip . -x ".git/*" "*/build/*" ".gradle/*"
          sha256sum foodcost-source-audit.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FoodCost-source-audit-0.7.7
          path: |
            foodcost-source-audit.zip
            SHA256SUMS.txt
          retention-days: 14
