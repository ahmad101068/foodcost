name: Signed FoodCost APK candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "presentation/**"
      - ".github/workflows/signed-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Load private signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FOODCOST_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOODCOST_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" || { echo "::error::Signing secrets missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/foodcost-release.p12"
          echo "FOODCOST_KEYSTORE_FILE=$RUNNER_TEMP/foodcost-release.p12" >> "$GITHUB_ENV"
      - name: Test and build signed release APK
        env:
          FOODCOST_KEYSTORE_PASSWORD: ${{ secrets.FOODCOST_KEYSTORE_PASSWORD }}
        run: ./gradlew :core:test :data:test :presentation:test :app:assembleRelease --no-daemon
      - name: Verify signing certificate
        shell: bash
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/certificate.txt"
          grep -qi "72c370e72612b453844e3a8c5d02d5ebc89c918f1ab68a56e22e4623309a8b22" "$RUNNER_TEMP/certificate.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: FoodCost-0.7.7-signed-candidate
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
