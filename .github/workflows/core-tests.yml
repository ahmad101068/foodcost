name: core-tests

# Runs only when the core or the build changes, to save the private repository's build minutes.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "core/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test --no-daemon
